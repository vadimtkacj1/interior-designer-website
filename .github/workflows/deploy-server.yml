name: Deploy to server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CONTACT_API_URL: ${{ secrets.VITE_BASE_URL }}
        run: npm run build

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: dist/*
          target: /var/www/html
          strip_components: 1

      # The `website` nginx container is a SHARED front proxy: besides this static
      # site it also serves go-apartsale.online (proxied to the apartment-copy
      # container) and terminates TLS on 443. Its /root/website/nginx.conf and
      # docker-compose.yml are maintained on the server, NOT from this repo.
      # Shipping this repo's copies here overwrote that config on 2026-07-10 and
      # took go-apartsale.online down for four days. Deploy only builds output,
      # then reload nginx to pick the new files up.
      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            docker exec website nginx -s reload
